databases:
  - name: keystone-db
    databaseName: keystone
    user: keystone
    plan: free

services:
  # ---------- Backend (Spring Boot, Docker) ----------
  - type: web
    runtime: docker
    name: keystone-backend
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: DB_HOST
        fromDatabase:
          name: keystone-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: keystone-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: keystone-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: keystone-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: keystone-db
          property: password

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRATION_MINUTES
        value: "120"

      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

  # ---------- Frontend (React static site) ----------
  - type: web
    runtime: static
    name: keystone-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
