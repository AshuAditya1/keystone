spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/keystone}
    username: ${DB_USERNAME:keystone}
    password: ${DB_PASSWORD:keystone_local_dev}
    driver-class-name: org.postgresql.Driver

keystone:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
