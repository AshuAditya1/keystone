spring:
  application:
    name: keystone

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${SPRING_DATASOURCE_USERNAME:keystone}
    password: ${SPRING_DATASOURCE_PASSWORD:keystone}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never creates or alters tables.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

# Application-specific settings (bound in config classes).
app:
  jwt:
    # Override with a long random value outside local dev (openssl rand -base64 48).
    secret: ${JWT_SECRET:local-dev-secret-please-change-this-to-a-long-random-value-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.meridian.keystone: DEBUG
